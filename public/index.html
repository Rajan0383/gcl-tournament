<!-- ========================================== -->
<!-- TEAMS GROUPING / AUCTION TAB -->
<!-- ========================================== -->
<div class="tab-content" id="tab-auction">
    <div class="auction-container">
        
        <!-- Admin Login -->
        <div id="auctionLogin" class="auction-login">
            <div class="login-box">
                <h2>🔐 Admin Access Required</h2>
                <p>Enter the admin password to access the Teams Grouping panel.</p>
                <div class="login-input-group">
                    <input type="password" id="auctionPassword" placeholder="Enter Password">
                    <button onclick="checkAuctionPassword()">Unlock</button>
                </div>
                <div id="auctionError" class="login-error">❌ Incorrect password!</div>
            </div>
        </div>

        <!-- Teams Grouping Content -->
        <div id="auctionContent" style="display: none;">
            <div class="teams-grouping-container">
                
                <div class="grouping-header">
                    <h2>🎯 Teams Grouping / Auction</h2>
                    <p class="grouping-subtitle">Assign teams to Group A or Group B</p>
                </div>

                <div class="grouping-main-layout">
                    <div class="grouping-left">
                        <div class="available-teams-section">
                            <h3>📋 Available Teams</h3>
                            <div class="available-teams-list" id="availableTeamsList">
                                <p class="empty-message">No teams available</p>
                            </div>
                            <button onclick="pickRandomTeam()" class="pick-random-btn">🎲 PICK RANDOM TEAM</button>
                        </div>
                    </div>

                    <div class="grouping-right">
                        <div class="group-status-section">
                            <h3>📊 Group Status</h3>
                            <div class="group-status-grid">
                                <div class="group-card group-a">
                                    <h4>🟡 Group A</h4>
                                    <div id="groupAList" class="group-teams-list">
                                        <p class="empty-message">No teams</p>
                                    </div>
                                </div>
                                <div class="group-card group-b">
                                    <h4>🟢 Group B</h4>
                                    <div id="groupBList" class="group-teams-list">
                                        <p class="empty-message">No teams</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="groupingMessage" class="grouping-message"></div>

                <div class="admin-settings" style="margin-top: 16px;">
                    <button onclick="logoutAuction()" class="logout-btn">🔒 Logout</button>
                </div>

            </div>
        </div>

    </div>
</div>
